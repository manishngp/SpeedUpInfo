<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
</head>

<body>

    <div class="calculator_container">
        <div class="calculator_inner_container">
            <div class="input_container">
                <input type="text" id="inp" value="">
                <input type="text" id="output" readonly value="00">
            </div>
            <div class="btn_container">
                <button class="btn" onclick="clearInp()" >AC</button>
                <button class="btn" onclick="backspace()" >
                    <i class="fa-solid fa-delete-left" style="color: rgb(0, 0, 0);"></i>
                </button>
                <button class="btn" onclick="mod()" >%</button>
                <button class="btn" onclick="div()" >
                    <i class="fa-solid fa-divide"></i>  
                </button>
                <button class="btn" onclick="seven()" >7</button>
                <button class="btn" onclick="eight()" >8</button>
                <button class="btn" onclick="nine()" >9</button>
                <button class="btn" onclick="mul()" >x</button>
                <button class="btn" onclick="four()" >4</button>
                <button class="btn" onclick="five()" >5</button>
                <button class="btn" onclick="six()" >6</button>
                <button class="btn" onclick="sub()" >-</button>
                <button class="btn" onclick="one()" >1</button>
                <button class="btn" onclick="two()" >2</button>
                <button class="btn" onclick="three()" >3</button>
                <button class="btn" onclick="add()" >+</button>
                <button class="btn" onclick="zero()" >0</button>
                <button class="btn" onclick="dot()" >.</button>
                <button class="btn lastbtn" onclick="result()">=</button>

            </div>
        </div>
    </div>
<script src="./script.js"></script>
</body>

</html>
